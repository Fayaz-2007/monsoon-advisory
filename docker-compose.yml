services:
  db:
    image: postgis/postgis:16-3.4
    container_name: monsoon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monsoon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monsoon}
      POSTGRES_DB: ${POSTGRES_DB:-monsoon}
    ports:
      # Host port 5433 avoids clashing with a locally installed PostgreSQL on 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monsoon} -d ${POSTGRES_DB:-monsoon}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
